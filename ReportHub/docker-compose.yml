      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=${REDIS_URL}
      - CLICKHOUSE_HOST=clickhouse
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
