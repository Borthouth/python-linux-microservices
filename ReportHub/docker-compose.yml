x-reporthub-logging: &reporthub-logging
  driver: fluentd
  options:
    fluentd-address: "127.0.0.1:24224"
    fluentd-async: "true"
    fluentd-async-reconnect-interval: "1s"
    fluentd-buffer-limit: "10000"
    fluentd-write-timeout: "2s"
    tag: "reporthub.{{.Name}}"
    env: REPORTHUB_LOG_QUEUE

services:
  ollama:
    image: ollama/ollama:latest
    container_name: reporthub-ollama
    logging: *reporthub-logging
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: reporthub-postgres
    logging: *reporthub-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - default
      - shared_network
    volumes:
      - ./docker/postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # --- ClickHouse Data Warehouse ---
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: reporthub-clickhouse
    ports:
      - "8123:8123" # HTTP interface / Client connections
      - "9000:9000" # Native TCP protocol
    networks:
      - default
      - shared_network
    volumes:
      - ./docker/clickhouse/data:/var/lib/clickhouse
      - ./docker/clickhouse/logs:/var/log/clickhouse-server
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-your_secure_password}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  operations_log_schema:
    build: .
    container_name: reporthub-operations-log-schema
    command: python manage.py provision_operations_logs
    env_file: .env
    volumes:
      - .:/app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
    depends_on:
      clickhouse:
        condition: service_started
      postgres:
        condition: service_started
    restart: "no"

  otel_collector:
    build:
      context: ./otel
    container_name: reporthub-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    env_file: .env
    environment:
      CLICKHOUSE_USER: ${OPERATIONS_LOGS_CLICKHOUSE_USER:-${APP_CLICKHOUSE_USER:-${CLICKHOUSE_USER:-default}}}
      CLICKHOUSE_PASSWORD: ${OPERATIONS_LOGS_CLICKHOUSE_PASSWORD:-${APP_CLICKHOUSE_PASSWORD:-${CLICKHOUSE_PASSWORD:-your_secure_password}}}
    ports:
      - "127.0.0.1:24224:24224"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/log:/hostfs/var/log:ro
      - otelcol_data:/var/lib/otelcol
      - operations_logging:/var/lib/reporthub-logging
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      operations_log_schema:
        condition: service_completed_successfully
      clickhouse:
        condition: service_started
    restart: unless-stopped

  # --- MinIO Object Storage Service ---
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: reporthub-minio
    logging: *reporthub-logging
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001"
    networks:
      - default
      - shared_network
    volumes:
      - ./docker/minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadminpassword}
    restart: unless-stopped

  redis:
      image: redis:7-alpine
      container_name: reporthub-redis
      logging: *reporthub-logging
      ports:
        - "6379:6379"
      networks:
        - default
        - shared_network
      volumes:
        - ./docker/redis_data:/data
      command: redis-server --appendonly yes
      restart: unless-stopped

  app:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    container_name: reporthub-app
    logging: *reporthub-logging
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=${REDIS_URL}
      - CLICKHOUSE_HOST=clickhouse
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-120}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadminpassword}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-reporthub-reports}
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-us-east-1}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - shared_network
    volumes:
      - .:/app
      - ./logs:/app/logs
      - operations_logging:/var/lib/reporthub-logging
    depends_on:
      - postgres
      - redis
      - clickhouse
      - minio
      - ollama
    restart: unless-stopped

  celery_ux_worker:
    build: .
    command: celery -A config worker -Q queue_ux,queue_hot --concurrency=2 --loglevel=info -n ux_worker@%h
    container_name: reporthub_celery_ux_worker
    logging: *reporthub-logging
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=${REDIS_URL}
      - CLICKHOUSE_HOST=clickhouse
      - REPORTHUB_LOG_QUEUE=queue_ux,queue_hot
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadminpassword}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-reporthub-reports}
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-us-east-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - shared_network
    volumes:
      - .:/app
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
      - clickhouse
      - minio
