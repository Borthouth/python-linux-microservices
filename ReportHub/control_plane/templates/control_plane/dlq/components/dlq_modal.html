<div id="dlq-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-6xl mx-4 overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
        <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/50">
            <h3 id="dlq-modal-title" class="text-base font-semibold text-white font-mono"></h3>
            <button onclick="closeDlqModal()" class="text-slate-400 hover:text-white text-sm">✕</button>
        </div>
        <!-- MUST be whitespace-pre-wrap break-all so newlines actually break lines -->
        <div class="slate-scrollbar p-6 overflow-auto flex-1 font-mono text-xs text-red-300 bg-slate-950/80 whitespace-pre-wrap break-all" id="dlq-modal-body"></div>
        <div class="px-6 py-4 border-t border-slate-800 bg-slate-950/50 flex justify-end">
            <button onclick="closeDlqModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-xl transition">Close</button>
        </div>
    </div>
</div>
