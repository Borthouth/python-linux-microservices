<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ReportHub Control Plane</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center">
    <div class="w-full max-w-md p-6">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-8">
            
            <!-- Header -->
            <div class="text-center mb-8">
                <span class="inline-block p-3 bg-indigo-500/10 border border-indigo-500/20 rounded-xl text-indigo-400 font-bold text-xl mb-3">📊</span>
                <h1 class="text-2xl font-bold tracking-tight text-white">ReportHub</h1>
                <p class="text-sm text-slate-400 mt-1">Sign in to your control plane</p>
            </div>

            <!-- Error Banner -->
            {% if form.errors %}
                <div class="mb-4 p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-sm text-center" role="alert">
                    Invalid username or password. Please try again.
                </div>
            {% endif %}

            <!-- Form -->
            <form method="post" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2" for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" required autofocus
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-all"
                        placeholder="Enter your username">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2" for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" required
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-all"
                        placeholder="••••••••••••">
                </div>

                <button type="submit" 
                    class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl shadow-lg shadow-indigo-600/20 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-800 transition-all text-sm">
                    Sign In
                </button>
            </form>
        </div>
        
        <p class="text-center text-xs text-slate-500 mt-6">&copy; 2026 ReportHub Security Engine. All rights reserved.</p>
    </div>
</body>
</html>
