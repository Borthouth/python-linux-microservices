<form method="GET" action="{{ action_url|default:'' }}" class="flex items-center gap-3">
    <div class="relative flex-1">
        <input type="text" 
               name="q" 
               value="{{ request.GET.q }}" 
               placeholder="{{ placeholder|default:'Search...' }}" 
               class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500/50 focus:ring-1 focus:ring-indigo-500/50 transition">
    </div>
    
    {% if request.GET.q %}
        <a href="." class="px-5 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-xl border border-slate-700 transition whitespace-nowrap shadow-sm text-center">
            Clear
        </a>
    {% endif %}

    <button type="submit" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium rounded-xl transition shadow-sm">
        Search
    </button>
</form>
