x-runtime-migrations: &runtime-migrations
  environment:
    MIGRATIONS_ON_STARTUP: "0"
  depends_on:
    migrations:
      condition: service_completed_successfully

services:
  migrations:
    build: .
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      MIGRATIONS_ON_STARTUP: "0"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      APP_POSTGRES_USER: ${MIGRATION_POSTGRES_USER:?Set MIGRATION_POSTGRES_USER for the migration service}
      APP_POSTGRES_PASSWORD: ${MIGRATION_POSTGRES_PASSWORD:?Set MIGRATION_POSTGRES_PASSWORD for the migration service}
    volumes:
      - .:/app
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_started
    restart: "no"

  app: *runtime-migrations
  celery_ux_worker: *runtime-migrations
  celery_warm_worker: *runtime-migrations
  celery_cdc_worker: *runtime-migrations
  celery_batch_worker: *runtime-migrations
  celery_cold_worker: *runtime-migrations
  celery_periodic_worker: *runtime-migrations
  celery_beat: *runtime-migrations
