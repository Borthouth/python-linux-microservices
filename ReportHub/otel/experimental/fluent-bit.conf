# Raw reassembly evaluation only. No production outputs or source controls.
[SERVICE]
    Flush                 0.2
    Grace                 2
    Log_Level             info
    HTTP_Server           On
    HTTP_Listen           0.0.0.0
    HTTP_Port             2020
    Health_Check          On

[INPUT]
    Name                  forward
    Listen                0.0.0.0
    Port                  24224
    Buffer_Chunk_Size     64K
    Buffer_Max_Size       1M
    Mem_Buf_Limit         8M

# Synthetic HTTP cases carry the same Docker fields; a separate case uses
# the real Docker Fluent Forward driver.
[INPUT]
    Name                  http
    Listen                0.0.0.0
    Port                  9880
    Tag_Key               fluent.tag
    Buffer_Max_Size       1M
    Mem_Buf_Limit         8M

[FILTER]
    Name                  multiline
    Match                 *
    Mode                  partial_message
    Multiline.Key_Content log
    Buffer                On
    Flush_MS              1000
    Emitter_Mem_Buf_Limit  8M

[OUTPUT]
    Name                  stdout
    Match                 *
    Format                json_lines
