services:
  postgres-test:
    image: postgres:15-alpine
    container_name: reporthub-postgres-test
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: chinook
    ports:
      - "5433:5432"
    command: ["postgres", "-c", "listen_addresses=*"]
    networks:
      - shared_network
    volumes:
      - pg_test_data:/var/lib/postgresql/data
      - ./init-db/postgres:/docker-entrypoint-initdb.d

  mysql-test:
    image: mysql:8.0
    container_name: reporthub-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: northwind
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
    ports:
      - "3307:3306"
    networks:
      - shared_network
    volumes:
      - mysql_test_data:/var/lib/mysql
      - ./init-db/mysql/1_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./init-db/mysql/2_data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro

  mssql-test:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: reporthub-mssql-test
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123!
      - MSSQL_PID=Developer
      - MSSQL_AGENT_ENABLED=true
    ports:
      - "1434:1433"
    networks:
      - shared_network
    volumes:
      - mssql_test_data:/var/opt/mssql
    restart: unless-stopped

  mongo-test:
    image: mongo:latest
    container_name: reporthub-mongo-test
    environment:
      MONGO_INITDB_ROOT_USERNAME: test_user
      MONGO_INITDB_ROOT_PASSWORD: test_password
      MONGO_INITDB_DATABASE: app_analytics
    ports:
      - "27018:27017"
    networks:
      - shared_network
    volumes:
      - mongo_test_data:/data/db
      - ./init-db/mongo:/docker-entrypoint-initdb.d
    restart: unless-stopped

  oracle-test:
    image: container-registry.oracle.com/database/free:latest
    container_name: reporthub-oracle-test
    environment:
      - ORACLE_PWD=YourStrongPassword123!
    ports:
      - "1522:1521"
      - "5500:5500"
    networks:
      - shared_network
    volumes:
      - oracle_test_data:/opt/oracle/oradata
      - ./init-db/oracle:/opt/oracle/scripts/startup
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: reporthub-mailpit
    ports:
      - "1025:1025"  # SMTP port for Django & Celery to connect to
      - "8025:8025"  # Web dashboard to view captured emails
    networks:
      - shared_network
    restart: unless-stopped

  sftp-test:
    image: atmoz/sftp:debian
    container_name: reporthub-sftp-test
    command: ["reporthub::1001:1001:upload"]
    ports:
      - "127.0.0.1:${SFTP_TEST_PORT:-2222}:22"
    networks:
      - shared_network
    volumes:
      - sftp_test_data:/home/reporthub/upload
      - sftp_test_host_keys:/etc/ssh
      - type: bind
        source: ${SFTP_TEST_KEY_DIR:-${HOME}/.local/share/reporthub/sftp-test}/client_ed25519.pub
        target: /home/reporthub/.ssh/keys/client_ed25519.pub
        read_only: true
        bind:
          create_host_path: false
      - ./sftp/prepare-upload.sh:/etc/sftp.d/prepare-upload.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "ssh-keyscan -T 2 -t ed25519 127.0.0.1 2>/dev/null | grep -q '^127.0.0.1 '"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

networks:
  shared_network:
    name: reporthub_shared_network
    external: true

volumes:
  pg_test_data:
  mysql_test_data:
  mssql_test_data:
  mongo_test_data:
  oracle_test_data:
  sftp_test_data:
  sftp_test_host_keys: