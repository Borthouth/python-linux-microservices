[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockersentinel"
version = "0.1.0"
description = "Lightweight Docker-socket and host system resource health sentinel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "docker>=6.1.0",
    "psutil>=5.9.0",
    "httpx>=0.24.0",
    "pydantic-settings>=2.0.0"
]

[tool.setuptools.packages.find]
where = ["."]