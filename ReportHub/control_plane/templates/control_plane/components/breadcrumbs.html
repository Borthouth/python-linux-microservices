<div class="bg-slate-950 py-3">
    <div class="max-w-7xl mx-auto px-6">
        <nav aria-label="Breadcrumb" class="flex items-center space-x-2 text-sm text-slate-400">
            <!-- Static Home Icon linking back to the dashboard -->
            <a href="{% url 'control_plane:dashboard' %}" class="hover:text-white transition-colors flex items-center">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
            </a>

            <!-- Loop through resolved breadcrumbs -->
            {% for crumb in breadcrumbs %}
                <span class="text-slate-600">/</span>
                {% if crumb.url %}
                    <a href="{{ crumb.url }}" class="hover:text-white transition-colors">{{ crumb.name }}</a>
                {% else %}
                    <!-- Current active page (grey or white depending on your preference) -->
                    <span class="text-slate-400 font-medium">{{ crumb.name }}</span>
                {% endif %}
            {% endfor %}
        </nav>
    </div>
</div>
