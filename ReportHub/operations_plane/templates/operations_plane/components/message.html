<div data-message class="flex items-center justify-between gap-4 rounded-xl border p-4 text-sm
    {% if level == 'error' %}border-rose-500/30 bg-rose-950/40 text-rose-200
    {% elif level == 'success' %}border-emerald-500/30 bg-emerald-950/40 text-emerald-200
    {% else %}border-amber-500/30 bg-amber-950/40 text-amber-200{% endif %}"
    role="{% if level == 'error' %}alert{% else %}status{% endif %}">
    <span data-message-text class="min-w-0">{{ text }}</span>
    <button type="button" data-dismiss-message aria-label="Dismiss message"
        class="shrink-0 rounded px-1 text-lg leading-none text-slate-400 transition hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-300">&times;</button>
</div>
